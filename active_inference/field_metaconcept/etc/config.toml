# field_metaconcept — THE FIELD as a metaconcept: the set of plots (world -> field -> plot -> row -> plant), one
# `metaconcept` node field_<id>. Not the world frame (that is `world`, openfield_concept). See src/specificworker.h.

[Proxies]
# No required Ice interfaces (DSR is the comms plane).

[Agent]
id = 31   # MUST be unique across the shared graph: robot=6 controller=8 retina=9 human=13 residual=14 openfield=25
          # vegetation=26 trunk=27 row=28 plant=29 plot=30 field=31. A collision = CRDT actor-id clash -> SIGSEGV.
name = "field_metaconcept"
configFile = ""
domain = 0
tree = false
graph = false
"2d" = false
"3d" = false

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

[Presence]
required_agent_names = ["plot_metaconcept"]
optional_agent_names = ["openfield_concept"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 15000
rejoin_grace_ms = 5000
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
nodes = ["field_metaconcept 31", "field_*"]

[Field]
# What makes the field be born. After its birth it follows the plots: a plot found later joins it.
#   "inspection": openfield_concept's inspection is complete (model_stable on the world node): no standpoint left in
#                 the field is worth its travel, so every plot that is going to be found has been found.
#   "stable":     the plots have not changed (none created, removed or regrouped) for StableForMs — the rule from
#                 before the inspection mode; it closes too early when the robot stands still.
CloseOn = "inspection"
StableForMs = 20000
UpdatePeriodMs = 1000
