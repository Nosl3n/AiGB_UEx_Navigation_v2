#VRML_SIM R2025a utf8
# Deck fixed to the carrier; marker black square = 0.24 m, texture including margin = 0.32 m.
PROTO InspectionDeck [ field SFVec3f translation 0 0 0 ] {
Solid {
  translation IS translation
  name "inspection landing deck"
  children [
    Shape {
      appearance PBRAppearance { baseColor 0.85 0.85 0.85 roughness 1 metalness 0 }
      geometry Box { size 0.70 0.70 0.025 }
    }
    Pose {
      translation 0 0.16 0.013
      children [ Shape {
        appearance PBRAppearance {
          baseColorMap ImageTexture { url [ "textures/inspection_aruco_23.png" ] filtering 0 }
          roughness 1 metalness 0
        }
        geometry Plane { size 0.32 0.32 }
      } ]
    }
    Pose {
      translation 0 0 -0.14
      children [ Shape {
        appearance PBRAppearance { baseColor 0.2 0.2 0.2 roughness 1 metalness 0 }
        geometry Box { size 0.10 0.10 0.28 }
      } ]
    }
  ]
  physics Physics { density -1 mass 0.8 }
  boundingObject Group { children [
    Box { size 0.70 0.70 0.025 }
    Pose { translation 0 0 -0.14 children [ Box { size 0.10 0.10 0.28 } ] }
  ] }
}
}
